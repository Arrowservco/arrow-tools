<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pleiades</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: block; touch-action: none; outline: none;
  }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Pleiades arcade game"></canvas>
<script>
(() => {
'use strict';

/* =====================================================================
   PLEIADES  —  portrait arcade shooter, touch + gamepad + keyboard
   Logical playfield is 360x640 (9:16) and is scaled to fit any screen.
   ===================================================================== */
const W = 360, H = 640, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const STAGE_NAMES = ['BIRDS', 'UFO RING', 'GNAT SWARM', 'DOCKING', 'MOTHERSHIP'];
const STAGE_HINTS = [
  'SHOOT THE DIVING BIRDS',
  'BREAK THE RINGS',
  'WIPE OUT WHOLE CHAINS FOR BONUS',
  'WARP THROUGH BARRIERS · DOCK IN THE BAY',
  'BLAST THROUGH THE ARMOR · KILL THE COMMANDER'
];
const SKY = ['#0a0a2c', '#1d0b33', '#082a2e', '#0b0b1c', '#2d0b14'];

/* ---------- persistence (safe) ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
};

/* ---------- canvas sizing ---------- */
let scale = 1;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / W, vh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  cv.width = Math.max(1, Math.round(W * scale * dpr));
  cv.height = Math.max(1, Math.round(H * scale * dpr));
}
addEventListener('resize', resize);
addEventListener('orientationchange', resize);
resize();

/* ---------- pixel sprites ---------- */
function mk(rows, pal, s) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas');
  c.width = w * s; c.height = h * s;
  const x = c.getContext('2d');
  rows.forEach((r, j) => {
    for (let i = 0; i < w; i++) {
      const col = pal[r[i]];
      if (col) { x.fillStyle = col; x.fillRect(i * s, j * s, s, s); }
    }
  });
  return c;
}
const SHIP = [
  '.....#.....', '.....#.....', '....###....', '....#o#....', '...##o##...',
  '.#.#####.#.', '.#+#####+#.', '.#########.', '##.#####.##', '#..+###+..#'
];
const BIRD_A = ['#...#.#...#', '##.#####.##', '.#########.', '..##+#+##..', '...#####...', '....#.#....'];
const BIRD_B = ['....###....', '.#########.', '##.##+##.##', '#..#####..#', '...#...#...', '..##...##..'];
const UFO = ['...#####...', '.#########.', '###+#+#+###', '.#########.', '..#.#.#.#..'];
const GNAT = ['#.....#', '##.#.##', '.#####.', '..#+#..', '..###..', '...#...'];
const CORE = [
  '....#####....', '..#########..', '.###########.', '###+#####+###',
  '###+#####+###', '.###########.', '..##.###.##..', '...##...##...'
];
const PALS = [
  { bird: ['#ff5b5b', '#ffe45e'], ufo: ['#4df0ff', '#ff4dd2'], gnat: ['#7dff6a', '#ffffff'] },
  { bird: ['#ffa24d', '#fff27a'], ufo: ['#b78bff', '#7dffe0'], gnat: ['#ff7ad9', '#ffffff'] },
  { bird: ['#59a8ff', '#e6f3ff'], ufo: ['#ffd24d', '#ff5b5b'], gnat: ['#4df0ff', '#ffffff'] }
];
const S = {
  ship: mk(SHIP, { '#': '#dfe9ff', '+': '#ff4d5e', o: '#4dd8ff' }, 3),
  core: mk(CORE, { '#': '#c14dff', '+': '#ffef6a' }, 4),
  coreHit: mk(CORE, { '#': '#ffffff', '+': '#ffffff' }, 4),
  bird: [], ufo: [], gnat: []
};
PALS.forEach(p => {
  const bp = { '#': p.bird[0], '+': p.bird[1] };
  S.bird.push([mk(BIRD_A, bp, 3), mk(BIRD_B, bp, 3)]);
  S.ufo.push(mk(UFO, { '#': p.ufo[0], '+': p.ufo[1] }, 3));
  S.gnat.push(mk(GNAT, { '#': p.gnat[0], '+': p.gnat[1] }, 3));
});

/* ---------- audio (tiny synth, no assets) ---------- */
let AC = null, muted = store.get('pleiades.mute') === '1', noiseBuf = null;
function audio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime, s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = noiseBuf; g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur);
}
function sfx(n) {
  switch (n) {
    case 'shoot': tone(900, 300, 0.07, 'square', 0.035); break;
    case 'hit': tone(320, 180, 0.05, 'square', 0.05); break;
    case 'boom': noise(0.25, 0.12); tone(180, 40, 0.25, 'sawtooth', 0.05); break;
    case 'die': noise(0.8, 0.22); tone(320, 28, 0.8, 'sawtooth', 0.1); break;
    case 'warp': tone(180, 1000, 0.25, 'sawtooth', 0.05); break;
    case 'bomb': tone(520, 240, 0.12, 'triangle', 0.045); break;
    case 'up': [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.12, 'square', 0.05, i * 0.09)); break;
    case 'clear': [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.14, 'square', 0.05, i * 0.1)); break;
    case 'start': [330, 440, 660].forEach((f, i) => tone(f, f, 0.1, 'square', 0.05, i * 0.08)); break;
    case 'bonus': tone(700, 1400, 0.2, 'triangle', 0.06); break;
  }
}
function rumble(ms, strong, weak) {
  try {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of gps) {
      if (gp && gp.vibrationActuator && gp.vibrationActuator.playEffect) {
        gp.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: weak });
      }
    }
    if (navigator.vibrate && !muted) navigator.vibrate(Math.min(ms, 200));
  } catch (e) { /* ignore */ }
}

/* ---------- game state ---------- */
const G = {
  state: 'title', prev: 'play', score: 0, hi: parseInt(store.get('pleiades.hi'), 10) || 0,
  lives: 3, nextLife: 20000, stageNum: 1, kind: 0, lvl: 0, t: 0, stageT: 0, timer: 0,
  deadT: 0, overT: 0, msg: '', bonus: 0, diveT: 2, ringFireT: 2, waveT: 0, wavesLeft: 0,
  wavePat: 0, barT: 0, hullY: -60, bayX: W / 2, bayOn: false, pad: false
};
const P = { x: W / 2, y: H - 70, alive: true, inv: 0, warp: false, energy: 100, cd: 0 };
let en = [], pb = [], eb = [], parts = [], rings = [], pops = [], bars = [], boss = null;
const stars = Array.from({ length: 90 }, () => ({ x: rnd(0, W), y: rnd(0, H), z: 1 + Math.floor(Math.random() * 3), p: rnd(0, TAU) }));

const yMin = () => G.kind === 3 ? 20 : 430;
const yMax = () => H - 28;

function addScore(n, x, y) {
  G.score += n;
  if (x !== undefined) pops.push({ x, y, txt: String(n), life: 0.8 });
  while (G.score >= G.nextLife) {
    G.lives = Math.min(G.lives + 1, 9);
    G.nextLife = G.nextLife === 20000 ? 60000 : G.nextLife + 60000;
    sfx('up'); pops.push({ x: W / 2, y: H / 2, txt: 'EXTRA SHIP!', life: 1.6, big: true });
  }
  if (G.score > G.hi) { G.hi = G.score; }
}

function explode(x, y, col, n, sp) {
  if (parts.length > 500) return;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), v = rnd(0.2, 1) * (sp || 140);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.35, 0.8), max: 0.8, col, sz: rnd(1.5, 3.5) });
  }
  rings.push({ x, y, r: 4, life: 0.35 });
}
function spawnBomb(x, y, vx, vy) { eb.push({ x, y, vx, vy }); sfx('bomb'); }

/* ---------- stages ---------- */
function beginStage() {
  G.kind = (G.stageNum - 1) % 5; G.lvl = Math.floor((G.stageNum - 1) / 5);
  en = []; pb = []; eb = []; bars = []; boss = null;
  G.state = 'intro'; G.timer = 2.4; G.stageT = 0;
  P.x = W / 2; P.y = H - 70; P.energy = 100; P.warp = false; P.inv = 0; P.alive = true; P.cd = 0;
}
function setupStage() {
  G.state = 'play'; G.stageT = 0; P.inv = 1.2;
  [setupBirds, setupUfos, setupGnats, setupDock, setupBoss][G.kind]();
}
const variant = () => G.lvl % 3;

function setupBirds() {
  const cols = 8, rows = Math.min(5, 3 + (G.lvl > 0 ? 1 : 0) + (G.lvl > 2 ? 1 : 0));
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const e = {
      type: 'bird', rad: 11, hp: 1, pts: 50, dpts: 150, st: 'enter', c, r,
      delay: (r * cols + c) * 0.06, fr: rnd(0, 1),
      x: c < cols / 2 ? -30 : W + 30, y: 40 + r * 10, bombT: 0
    };
    e.home = () => {
      const ox = W / 2 + Math.sin(G.stageT * 0.9) * 26;
      e.hx = ox + (c - (cols - 1) / 2) * 34;
      e.hy = 80 + r * 30 + Math.sin(G.stageT * 2 + c) * 3;
    };
    en.push(e);
  }
  G.diveT = 3;
}
function setupUfos() {
  const rings = [{ R: 52, n: 6, w: 1.0 }, { R: 96, n: 10, w: -0.7 }];
  if (G.lvl >= 1) rings.push({ R: 140, n: 14, w: 0.5 });
  rings.forEach((rg, ri) => {
    for (let k = 0; k < rg.n; k++) {
      const e = { type: 'ufo', rad: 12, hp: 1, pts: 80, dpts: 160, st: 'form', fr: rnd(0, 1), bombT: 0, x: W / 2, y: -50 };
      e.home = () => {
        const ent = clamp(G.stageT / 2.6, 0, 1), ez = 1 - Math.pow(1 - ent, 3);
        const cx = W / 2 + Math.sin(G.stageT * 0.5) * 28, cy = 175 + Math.sin(G.stageT * 0.7) * 10;
        const a = (k / rg.n) * TAU + rg.w * G.stageT + (1 - ez) * 7;
        const R = rg.R * ez * (1 + Math.sin(G.stageT * 1.3 + ri) * 0.06);
        e.hx = cx + Math.cos(a) * R; e.hy = cy + Math.sin(a) * R * 0.9;
      };
      en.push(e);
    }
  });
  G.diveT = 4; G.ringFireT = 3;
}
function setupGnats() {
  G.wavesLeft = Math.min(9, 5 + G.lvl); G.wavePat = 0; G.waveT = 0.6;
}
function spawnWave() {
  const pat = ['sine', 'sideL', 'swoop', 'sideR', 'sine2'][G.wavePat++ % 5];
  const n = 8, ch = { left: n, killed: 0, total: n };
  const bx = rnd(110, 250), tx = clamp(P.x + rnd(-30, 30), 40, W - 40);
  for (let k = 0; k < n; k++) {
    en.push({
      type: 'gnat', rad: 9, hp: 1, pts: 100, dpts: 100, pat, ch, age: -k * 0.2, k,
      bx, tx, ph: pat === 'sine2' ? Math.PI : 0, x: -99, y: -99,
      vy: 130 + G.lvl * 12 + rnd(0, 10), by: rnd(40, 110)
    });
  }
  G.wavesLeft--;
}
function setupDock() {
  G.barT = 2; G.hullY = -60; G.bayOn = false; G.bayX = W / 2;
  P.y = H - 70;
}
function setupBoss() {
  const max = 36 + G.lvl * 10;
  boss = { x: W / 2, y: 82, hp: max, max, t: 0, fire: 1.8, beltT: 2, hit: 0, dying: false, dyT: 0, rows: [] };
  const spec = [{ y: 124, dir: 1, spd: 26, hp: 3 }, { y: 142, dir: -1, spd: 38, hp: 2 }, { y: 160, dir: 1, spd: 52, hp: 2 }];
  spec.forEach(s => boss.rows.push({
    y: s.y, dir: s.dir, spd: s.spd * (1 + G.lvl * 0.12), off: rnd(0, 480),
    blocks: Array.from({ length: 10 }, () => s.hp), maxhp: s.hp
  }));
}
const BLK_S = 48, BLK_N = 10, BLK_T = BLK_S * BLK_N;
const blockX = (row, i) => (((i * BLK_S + row.off) % BLK_T) + BLK_T) % BLK_T - 60;

function stageClear(msg, bonus) {
  G.state = 'clear'; G.timer = 2.8; G.msg = msg; G.bonus = bonus;
  addScore(bonus); eb = []; sfx('clear');
}

/* ---------- input ---------- */
const kb = {}, edge = { start: false, pause: false, mute: false };
const touch = { id: null, x0: 0, y0: 0, px: 0, py: 0, cx: 0, cy: 0 };
let warpPtr = null;
const padPrev = {};
const WB = { x: W - 46, y: H - 62, r: 30 };
const PAUSE_BTN = { x: W - 20, y: 22, r: 16 };
const MUTE_BTN = { x: W - 54, y: 22, r: 16 };

addEventListener('keydown', e => {
  kb[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  audio();
  if (e.code === 'Enter' || e.code === 'Space') edge.start = true;
  if (e.code === 'KeyP' || e.code === 'Escape') edge.pause = true;
  if (e.code === 'KeyM') edge.mute = true;
});
addEventListener('keyup', e => { kb[e.code] = false; });
addEventListener('blur', () => { for (const k in kb) kb[k] = false; autoPause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
addEventListener('gamepadconnected', () => { G.pad = true; });
addEventListener('gamepaddisconnected', () => { G.pad = !!(navigator.getGamepads && [...navigator.getGamepads()].some(g => g && g.connected)); });
function autoPause() {
  if (G.state === 'play' || G.state === 'intro' || G.state === 'clear') { G.prev = G.state; G.state = 'paused'; }
}

function lp(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}
const inBtn = (b, x, y, pad) => Math.hypot(x - b.x, y - b.y) <= b.r + (pad || 0);
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  const [x, y] = lp(e);
  if (inBtn(MUTE_BTN, x, y, 6)) { toggleMute(); return; }
  if (inBtn(PAUSE_BTN, x, y, 6)) { edge.pause = true; return; }
  const live = G.state === 'play' || G.state === 'intro' || G.state === 'clear';
  if (!live) { edge.start = true; return; }
  if (warpPtr === null && inBtn(WB, x, y, 14)) { warpPtr = e.pointerId; return; }
  if (touch.id === null) {
    touch.id = e.pointerId; touch.x0 = touch.cx = x; touch.y0 = touch.cy = y;
    touch.px = P.x; touch.py = P.y;
  }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId === touch.id) { const [x, y] = lp(e); touch.cx = x; touch.cy = y; }
});
const release = e => {
  if (e.pointerId === touch.id) touch.id = null;
  if (e.pointerId === warpPtr) warpPtr = null;
};
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());
function toggleMute() { muted = !muted; store.set('pleiades.mute', muted ? '1' : '0'); }

function readInput() {
  const i = { mx: 0, my: 0, fire: false, warp: false, start: false, pause: false, tx: null, ty: null };
  i.mx = (kb.ArrowRight || kb.KeyD ? 1 : 0) - (kb.ArrowLeft || kb.KeyA ? 1 : 0);
  i.my = (kb.ArrowDown || kb.KeyS ? 1 : 0) - (kb.ArrowUp || kb.KeyW ? 1 : 0);
  i.fire = !!(kb.Space || kb.KeyZ || kb.KeyJ);
  i.warp = !!(kb.ShiftLeft || kb.ShiftRight || kb.KeyX || kb.KeyK);
  i.start = edge.start; i.pause = edge.pause;
  if (edge.mute) toggleMute();
  edge.start = edge.pause = edge.mute = false;

  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  let anyPad = false;
  for (const gp of gps) {
    if (!gp || !gp.connected) continue;
    anyPad = true;
    const b = gp.buttons || [], ax = gp.axes || [];
    const down = k => !!(b[k] && (b[k].pressed || b[k].value > 0.5));
    let gx = ax[0] || 0, gy = ax[1] || 0;
    const mag = Math.hypot(gx, gy);
    if (mag > 0.22) { const m = (mag - 0.22) / 0.78 / mag; i.mx += gx * m * 1.15; i.my += gy * m * 1.15; }
    i.mx += (down(15) ? 1 : 0) - (down(14) ? 1 : 0);
    i.my += (down(13) ? 1 : 0) - (down(12) ? 1 : 0);
    if (down(0) || down(2) || down(5) || down(7)) i.fire = true;
    if (down(1) || down(3) || down(4) || down(6)) i.warp = true;
    const prev = padPrev[gp.index] || (padPrev[gp.index] = []);
    const edgeBtn = k => { const d = down(k); const r = d && !prev[k]; prev[k] = d; return r; };
    if (edgeBtn(9)) { i.start = true; i.pause = true; }
    if (edgeBtn(0)) i.start = true;
    if (edgeBtn(8)) toggleMute();
  }
  G.pad = anyPad;
  const m = Math.hypot(i.mx, i.my);
  if (m > 1) { i.mx /= m; i.my /= m; }

  if (touch.id !== null) {
    i.tx = touch.px + (touch.cx - touch.x0) * 1.2;
    i.ty = touch.py + (touch.cy - touch.y0) * 1.2;
    i.fire = true;
  }
  if (warpPtr !== null) i.warp = true;
  return i;
}

/* ---------- game flow ---------- */
function newGame() {
  G.score = 0; G.lives = 3; G.nextLife = 20000; G.stageNum = 1;
  parts = []; rings = []; pops = [];
  const q = new URLSearchParams(location.search).get('stage');
  if (q && /^\d+$/.test(q)) G.stageNum = Math.max(1, +q);
  beginStage(); sfx('start');
}
function gameOver() {
  G.state = 'over'; G.overT = 1.4;
  store.set('pleiades.hi', String(G.hi));
}
function killPlayer() {
  P.alive = false; G.lives--; G.deadT = 1.7;
  explode(P.x, P.y, '#dfe9ff', 26, 220); explode(P.x, P.y, '#ff4d5e', 16, 160);
  sfx('die'); rumble(450, 1, 0.7);
}
function hurt() { if (P.alive && P.inv <= 0 && !P.warp && G.state === 'play') killPlayer(); }
function respawn() {
  P.alive = true; P.x = W / 2; P.y = H - 70; P.inv = 2.4; P.energy = 100; P.warp = false; eb = [];
}
function killEnemy(e) {
  e.dead = true;
  const pts = e.st === 'dive' ? e.dpts : e.pts;
  addScore(pts, e.x, e.y - 10);
  explode(e.x, e.y, e.type === 'bird' ? '#ff8a5b' : e.type === 'ufo' ? '#6af0ff' : '#9dff7a', 12, 140);
  sfx('boom'); rumble(60, 0.2, 0.4);
  if (e.ch) {
    e.ch.killed++; e.ch.left--;
    if (e.ch.left === 0 && e.ch.killed === e.ch.total) {
      addScore(1000, e.x, e.y - 28); sfx('bonus');
      pops.push({ x: e.x, y: e.y - 44, txt: 'CHAIN BONUS', life: 1.2, big: true });
    }
  }
}

/* ---------- update ---------- */
function moveToward(e, tx, ty, step) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if (d <= step) { e.x = tx; e.y = ty; return true; }
  e.x += dx / d * step; e.y += dy / d * step; return false;
}

function updFormation(dt) {
  let divers = 0, formed = 0;
  for (const e of en) {
    e.home();
    if (e.st === 'enter') {
      e.delay -= dt;
      if (e.delay <= 0 && moveToward(e, e.hx, e.hy, 320 * dt)) e.st = 'form';
    } else if (e.st === 'form') {
      e.x = e.hx; e.y = e.hy; formed++;
    } else if (e.st === 'ret') {
      if (moveToward(e, e.hx, e.hy, 240 * dt)) e.st = 'form';
    } else if (e.st === 'dive') {
      divers++;
      e.dt += dt; e.y += e.vy * dt;
      const p = clamp((e.y - e.y0) / (520 - e.y0), 0, 1);
      e.x = e.x0 + (e.tx - e.x0) * p * 0.85 + Math.sin(e.dt * 4) * 32 * e.dir * (1 - p * 0.5);
      e.bombT -= dt;
      if (e.bombT <= 0 && e.y > 60 && e.y < P.y - 90) {
        spawnBomb(e.x, e.y + 10, clamp((P.x - e.x) * 0.3, -70, 70), 190 + G.lvl * 18);
        e.bombT = rnd(0.8, 1.5);
      }
      if (e.y > H + 24) { e.st = 'ret'; e.y = -24; e.x = e.hx; }
    }
  }
  G.diveT -= dt;
  const maxDivers = 1 + Math.floor(G.lvl / 1.5) + (en.length < 10 ? 1 : 0);
  if (G.diveT <= 0 && G.stageT > 3.2 && divers < maxDivers) {
    const pool = en.filter(e => e.st === 'form');
    if (pool.length) {
      const e = pool[Math.floor(Math.random() * pool.length)];
      e.st = 'dive'; e.dt = 0; e.x0 = e.x; e.y0 = e.y; e.dir = Math.random() < 0.5 ? -1 : 1;
      e.vy = 170 + G.lvl * 15 + rnd(0, 40); e.tx = P.x; e.bombT = rnd(0.3, 0.8);
    }
    G.diveT = Math.max(0.5, rnd(0.7, 1.5) * (1.3 - G.lvl * 0.15) * (en.length < 8 ? 0.6 : 1));
  }
  if (G.kind === 1 && G.stageT > 3) {
    G.ringFireT -= dt;
    if (G.ringFireT <= 0) {
      const pool = en.filter(e => e.st === 'form');
      if (pool.length) {
        const e = pool[Math.floor(Math.random() * pool.length)];
        spawnBomb(e.x, e.y + 8, clamp((P.x - e.x) * 0.35, -90, 90), 170 + G.lvl * 18);
      }
      G.ringFireT = Math.max(0.45, 1.3 - G.lvl * 0.15);
    }
  }
  if (!en.length) stageClear('STAGE CLEAR', 1000 * (G.kind + 1));
}

function updGnats(dt) {
  G.waveT -= dt;
  if (G.wavesLeft > 0 && G.waveT <= 0) { spawnWave(); G.waveT = Math.max(1.6, 3.1 - G.lvl * 0.25); }
  for (const e of en) {
    e.age += dt;
    if (e.age < 0) continue;
    const a = e.age;
    switch (e.pat) {
      case 'sine': e.y = -20 + e.vy * a; e.x = e.bx + Math.sin(a * 3 + e.ph) * 75; break;
      case 'sine2': e.y = -20 + e.vy * a; e.x = W - e.bx + Math.sin(a * 2.4 + e.ph) * 90; break;
      case 'sideL': e.x = -20 + 150 * a; e.y = e.by + a * 38 + Math.sin(a * 4) * 30; break;
      case 'sideR': e.x = W + 20 - 150 * a; e.y = e.by + a * 38 + Math.sin(a * 4) * 30; break;
      case 'swoop': { const u = clamp(a / 2.4, 0, 1), s = u * u * (3 - 2 * u); e.y = -20 + e.vy * 1.1 * a; e.x = e.bx + (e.tx - e.bx) * s + Math.sin(a * 5) * 14; break; }
    }
    if (e.y > 30 && e.y < 380 && Math.random() < dt * 0.14 * (1 + G.lvl * 0.3)) {
      spawnBomb(e.x, e.y + 8, clamp((P.x - e.x) * 0.2, -50, 50), 180 + G.lvl * 15);
    }
    if (a > 1 && (e.y > H + 30 || e.x < -50 || e.x > W + 50)) { e.dead = true; e.ch.left--; }
  }
  if (G.wavesLeft <= 0 && en.every(e => e.dead)) stageClear('STAGE CLEAR', 1000 * (G.kind + 1));
}

function updDock(dt) {
  const dockT = Math.max(9, 13 - G.lvl);
  G.bayOn = G.stageT >= dockT;
  G.bayX = W / 2 + Math.sin(G.stageT * 0.9) * 90;
  G.hullY = G.bayOn ? Math.min(0, G.hullY + 70 * dt) : G.hullY;
  G.barT -= dt;
  if (G.barT <= 0) {
    const gw = Math.max(72, 112 - G.lvl * 8);
    bars.push({
      y: -10, gx: rnd(gw / 2 + 12, W - gw / 2 - 12), gw,
      d: (Math.random() < 0.5 ? -1 : 1) * rnd(15, 55) * (1 + G.lvl * 0.2)
    });
    G.barT = Math.max(0.9, 1.55 - G.lvl * 0.1 - G.stageT * 0.004);
  }
  const sp = 95 + G.lvl * 10 + Math.min(G.stageT, 40) * 1.4;
  for (const b of bars) {
    b.y += sp * dt; b.gx += b.d * dt;
    if (b.gx < b.gw / 2 + 8 || b.gx > W - b.gw / 2 - 8) b.d = -b.d;
    if (P.alive && Math.abs(P.y - b.y) < 13 && (P.x - 7 < b.gx - b.gw / 2 || P.x + 7 > b.gx + b.gw / 2)) hurt();
  }
  bars = bars.filter(b => b.y < H + 20);
  if (G.bayOn && G.hullY >= 0 && P.alive) {
    const dx = Math.abs(P.x - G.bayX);
    if (P.y <= 38 && dx < 16) {
      stageClear('DOCKING COMPLETE', 2000 + Math.round(P.energy) * 10);
      sfx('bonus'); P.warp = false; bars = [];
    } else if (P.y - 10 < G.hullY + 48 && dx >= 16) hurt();
  }
}

function updBoss(dt) {
  const b = boss; b.t += dt; b.hit = Math.max(0, b.hit - dt);
  for (const r of b.rows) r.off += r.dir * r.spd * dt;
  if (b.dying) {
    b.dyT -= dt;
    if (Math.random() < dt * 22) explode(b.x + rnd(-34, 34), b.y + rnd(-20, 40), Math.random() < 0.5 ? '#ffb347' : '#ff5b5b', 10, 170);
    if (b.dyT <= 0) {
      explode(b.x, b.y, '#ffffff', 40, 280); rumble(700, 1, 1);
      boss = null; stageClear('MOTHERSHIP DESTROYED', 5000);
    }
    return;
  }
  b.x = W / 2 + Math.sin(b.t * 0.6) * 60;
  b.fire -= dt;
  const low = b.hp < b.max / 2;
  if (b.fire <= 0) {
    b.fire = Math.max(0.7, 1.7 - G.lvl * 0.12) * (low ? 0.7 : 1);
    const ang = Math.atan2(P.y - b.y, P.x - b.x), sp = 150 + G.lvl * 15, n = low ? 3 : 1;
    for (let k = 0; k < n; k++) {
      const a = ang + (k - (n - 1) / 2) * 0.3;
      eb.push({ x: b.x, y: b.y + 16, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp });
    }
    sfx('bomb');
  }
  b.beltT -= dt;
  if (b.beltT <= 0) {
    const row = b.rows[2], idx = [];
    row.blocks.forEach((h, i) => { const x = blockX(row, i); if (h > 0 && x > 10 && x < W - 10) idx.push(i); });
    if (idx.length) { const i = idx[Math.floor(Math.random() * idx.length)]; spawnBomb(blockX(row, i), row.y + 8, 0, 175 + G.lvl * 15); }
    b.beltT = rnd(1.1, 2.2);
  }
}

function updateBullets(dt) {
  for (const b of pb) { b.py = b.y; b.y -= 520 * dt; if (b.y < -10) b.dead = true; }
  for (const b of pb) {
    if (b.dead) continue;
    for (const e of en) {
      if (e.dead || (e.age !== undefined && e.age < 0)) continue;
      const dx = b.x - e.x, dy = b.y - e.y, rr = e.rad + 4;
      if (dx * dx + dy * dy < rr * rr) { b.dead = true; killEnemy(e); break; }
    }
    if (b.dead || !boss) continue;
    // armor belts (lowest row first)
    for (let ri = boss.rows.length - 1; ri >= 0 && !b.dead; ri--) {
      const row = boss.rows[ri];
      if (b.y - 4 > row.y + 8 || b.py + 4 < row.y - 8) continue;
      for (let i = 0; i < row.blocks.length; i++) {
        if (row.blocks[i] <= 0) continue;
        if (Math.abs(b.x - blockX(row, i)) < 20) {
          b.dead = true; row.blocks[i]--;
          if (row.blocks[i] <= 0) { addScore(30, b.x, row.y - 8); explode(b.x, row.y, '#9aa7ff', 8, 110); sfx('boom'); }
          else sfx('hit');
          break;
        }
      }
    }
    if (b.dead || boss.dying) continue;
    if (Math.abs(b.x - boss.x) < 26 && Math.abs(b.y - boss.y) < 20) {
      b.dead = true; boss.hp--; boss.hit = 0.08; addScore(50); sfx('hit');
      explode(b.x, b.y, '#ffef6a', 3, 90);
      if (boss.hp <= 0) {
        boss.dying = true; boss.dyT = 2.2; eb = [];
        boss.rows.forEach(r => r.blocks.fill(0));
        addScore(2000, boss.x, boss.y - 30);
      }
    }
  }
  pb = pb.filter(b => !b.dead);
}

function update(dt, inp) {
  G.t += dt;
  // global keys
  if (G.state === 'title') {
    if (inp.start) { audio(); newGame(); }
  } else if (G.state === 'over') {
    G.overT -= dt;
    if (inp.start && G.overT <= 0) { newGame(); }
  } else if (G.state === 'paused') {
    if (inp.pause || inp.start) G.state = G.prev;
  } else if (inp.pause) {
    G.prev = G.state; G.state = 'paused';
  }

  // star scroll
  const ss = G.kind === 3 && G.state !== 'title' ? 3.2 : 1;
  for (const s of stars) { s.y += s.z * 18 * ss * dt; if (s.y > H) { s.y -= H; s.x = rnd(0, W); } }

  // fx always run
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; p.vy *= 0.985; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const r of rings) { r.r += 160 * dt; r.life -= dt; }
  rings = rings.filter(r => r.life > 0);
  for (const p of pops) { p.y -= 28 * dt; p.life -= dt; }
  pops = pops.filter(p => p.life > 0);

  const live = G.state === 'play' || G.state === 'intro' || G.state === 'clear';
  if (!live) return;

  // ---- player ----
  if (P.alive) {
    const sp = 235;
    P.x += inp.mx * sp * dt; P.y += inp.my * sp * dt;
    if (inp.tx !== null) {
      const k = Math.min(1, dt * 28);
      P.x += (inp.tx - P.x) * k; P.y += (inp.ty - P.y) * k;
    }
    if (G.state === 'clear' && G.kind === 3 && G.msg === 'DOCKING COMPLETE') {
      P.x += (G.bayX - P.x) * Math.min(1, dt * 6); P.y = Math.max(8, P.y - 70 * dt);
    } else {
      P.x = clamp(P.x, 16, W - 16); P.y = clamp(P.y, yMin(), yMax());
    }
    P.inv = Math.max(0, P.inv - dt); P.cd = Math.max(0, P.cd - dt);
    const wantWarp = inp.warp && G.state !== 'clear';
    const was = P.warp;
    P.warp = wantWarp && (was ? P.energy > 0 : P.energy >= 20);
    if (P.warp) { P.energy = Math.max(0, P.energy - 55 * dt); if (!was) sfx('warp'); }
    else P.energy = Math.min(100, P.energy + 22 * dt);
    if (inp.fire && !P.warp && P.cd <= 0 && G.state === 'play' && pb.length < 6) {
      pb.push({ x: P.x, y: P.y - 14, py: P.y - 14 }); P.cd = 0.17; sfx('shoot');
    }
  } else if (G.state === 'play') {
    G.deadT -= dt;
    if (G.deadT <= 0) { if (G.lives <= 0) gameOver(); else respawn(); }
  }

  if (G.state === 'intro') {
    G.timer -= dt;
    if (G.timer <= 0) setupStage();
    return;
  }
  if (G.state === 'clear') {
    G.timer -= dt;
    if (G.timer <= 0) { G.stageNum++; beginStage(); }
    eb = [];
    updateBullets(dt);
    return;
  }

  // ---- stage ----
  G.stageT += dt;
  if (G.kind === 0 || G.kind === 1) updFormation(dt);
  else if (G.kind === 2) updGnats(dt);
  else if (G.kind === 3) updDock(dt);
  else if (boss) updBoss(dt);
  if (G.state !== 'play') { en = en.filter(e => !e.dead); return; }

  updateBullets(dt);
  en = en.filter(e => !e.dead);

  // enemy bombs
  for (const b of eb) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 10 || b.x < -10 || b.x > W + 10 || b.y < -20) b.dead = true;
    else if (P.alive && Math.hypot(b.x - P.x, b.y - P.y) < 10) { b.dead = true; hurt(); }
  }
  eb = eb.filter(b => !b.dead);
  // enemy bodies
  if (P.alive) for (const e of en) {
    if (e.dead || (e.age !== undefined && e.age < 0)) continue;
    if (Math.hypot(e.x - P.x, e.y - P.y) < e.rad + 8) { if (P.inv <= 0 && !P.warp) { killEnemy(e); hurt(); } }
  }
  en = en.filter(e => !e.dead);
}

/* ---------- rendering ---------- */
function txt(s, x, y, size, col, align, glow) {
  ctx.font = `bold ${size}px "Courier New", ui-monospace, monospace`;
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 12; }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
  ctx.shadowBlur = 0;
}
const spr = (c, x, y) => ctx.drawImage(c, Math.round(x - c.width / 2), Math.round(y - c.height / 2));

function drawBg() {
  const k = G.state === 'title' ? 0 : G.kind;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#000000'); g.addColorStop(1, SKY[k]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    const tw = 0.55 + 0.45 * Math.sin(G.t * 2 + s.p);
    ctx.globalAlpha = (0.25 + s.z * 0.2) * tw + 0.2;
    ctx.fillStyle = s.z === 3 ? '#ffffff' : s.z === 2 ? '#bcd0ff' : '#7f8fc0';
    const len = G.kind === 3 && G.state !== 'title' ? s.z * 3 : s.z * 0.8;
    ctx.fillRect(s.x, s.y, s.z * 0.7 + 0.3, len + 0.6);
  }
  ctx.globalAlpha = 1;
}

function drawShip(x, y, flicker) {
  if (P.warp) {
    ctx.globalAlpha = 0.45; spr(S.ship, x, y); ctx.globalAlpha = 1;
    ctx.strokeStyle = '#4df0ff'; ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(G.t * 30);
    ctx.beginPath(); ctx.arc(x, y, 20 + Math.sin(G.t * 20) * 2, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1; return;
  }
  if (flicker && Math.floor(G.t * 14) % 2) return;
  const f = 6 + Math.random() * 7;
  ctx.fillStyle = '#ffb347'; ctx.fillRect(x - 3, y + 14, 6, f);
  ctx.fillStyle = '#fff3b0'; ctx.fillRect(x - 1.5, y + 14, 3, f * 0.6);
  spr(S.ship, x, y);
}

function drawEnemies() {
  const v = variant();
  for (const e of en) {
    if (e.age !== undefined && e.age < 0) continue;
    if (e.type === 'bird') spr(S.bird[v][Math.floor(G.t * 4 + e.fr * 2) % 2], e.x, e.y);
    else if (e.type === 'ufo') {
      spr(S.ufo[v], e.x, e.y);
      ctx.fillStyle = `hsl(${(G.t * 200 + e.fr * 360) % 360},100%,70%)`;
      ctx.fillRect(Math.round(e.x) - 1, Math.round(e.y) + 5, 3, 2);
    } else spr(S.gnat[v], e.x, e.y);
  }
}

function drawBoss() {
  const b = boss;
  // armor plate backdrop
  ctx.fillStyle = 'rgba(30,34,70,0.85)';
  ctx.fillRect(0, 112, W, 58);
  ctx.fillStyle = '#4c58a8'; ctx.fillRect(0, 111, W, 2); ctx.fillRect(0, 170, W, 2);
  // core housing
  ctx.fillStyle = '#20264f'; ctx.fillRect(b.x - 52, b.y - 30, 104, 62);
  ctx.strokeStyle = '#6674d8'; ctx.lineWidth = 2; ctx.strokeRect(b.x - 52, b.y - 30, 104, 62);
  const pulse = 0.6 + 0.4 * Math.sin(G.t * 6);
  ctx.fillStyle = `rgba(255,80,160,${0.12 + 0.12 * pulse})`;
  ctx.fillRect(b.x - 50, b.y - 28, 100, 58);
  spr(b.hit > 0 ? S.coreHit : S.core, b.x + (b.dying ? rnd(-3, 3) : 0), b.y);
  // hp bar
  const w = 120, f = clamp(b.hp / b.max, 0, 1);
  ctx.fillStyle = '#220'; ctx.fillRect(W / 2 - w / 2, 52, w, 5);
  ctx.fillStyle = f > 0.5 ? '#6aff7a' : f > 0.25 ? '#ffd24d' : '#ff4d4d';
  ctx.fillRect(W / 2 - w / 2, 52, w * f, 5);
  // belts
  const cols = ['#ff9f43', '#5fa8ff', '#9d7bff'];
  b.rows.forEach((row, ri) => {
    row.blocks.forEach((h, i) => {
      if (h <= 0) return;
      const x = blockX(row, i);
      if (x < -20 || x > W + 20) return;
      ctx.fillStyle = cols[ri]; ctx.globalAlpha = 0.55 + 0.45 * (h / row.maxhp);
      ctx.fillRect(x - 17, row.y - 7, 34, 14);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x - 17, row.y - 7, 34, 3);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x - 17, row.y + 4, 34, 3);
    });
  });
}

function drawDock() {
  // barriers
  for (const b of bars) {
    const l = b.gx - b.gw / 2, r = b.gx + b.gw / 2;
    for (const [x0, x1] of [[0, l], [r, W]]) {
      ctx.fillStyle = '#2a1a10'; ctx.fillRect(x0, b.y - 8, x1 - x0, 16);
      ctx.save(); ctx.beginPath(); ctx.rect(x0, b.y - 8, x1 - x0, 16); ctx.clip();
      ctx.fillStyle = '#ff9f2e';
      for (let sx = x0 - 20 + ((b.y * 0.7) % 20); sx < x1 + 20; sx += 20) {
        ctx.beginPath(); ctx.moveTo(sx, b.y + 8); ctx.lineTo(sx + 10, b.y + 8); ctx.lineTo(sx + 20, b.y - 8); ctx.lineTo(sx + 10, b.y - 8); ctx.fill();
      }
      ctx.restore();
    }
    ctx.fillStyle = '#ffe9a8'; ctx.fillRect(l - 3, b.y - 10, 3, 20); ctx.fillRect(r, b.y - 10, 3, 20);
  }
  if (G.hullY > -60 && G.bayOn) {
    const y = G.hullY, bx = G.bayX;
    ctx.fillStyle = '#2a3158'; ctx.fillRect(0, y, bx - 22, 48); ctx.fillRect(bx + 22, y, W - bx - 22, 48);
    ctx.fillStyle = '#4a58a8'; ctx.fillRect(0, y + 44, bx - 22, 4); ctx.fillRect(bx + 22, y + 44, W - bx - 22, 4);
    ctx.fillStyle = '#10142e'; ctx.fillRect(bx - 22, y, 44, 48);
    const on = Math.floor(G.t * 5) % 2;
    ctx.fillStyle = on ? '#6aff7a' : '#2b7a35';
    for (let k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.moveTo(bx - 14, y + 10 + k * 12 + 8); ctx.lineTo(bx, y + 10 + k * 12); ctx.lineTo(bx + 14, y + 10 + k * 12 + 8); ctx.lineTo(bx + 14, y + 10 + k * 12 + 11); ctx.lineTo(bx, y + 10 + k * 12 + 3); ctx.lineTo(bx - 14, y + 10 + k * 12 + 11); ctx.fill();
    }
    ctx.fillStyle = '#ffef6a'; ctx.fillRect(bx - 23, y + 40, 4, 8); ctx.fillRect(bx + 19, y + 40, 4, 8);
    if (G.state === 'play' && G.hullY >= 0) txt('DOCK!', W / 2, 70, 14, '#6aff7a', 'center');
  }
}

function drawHUD() {
  txt('SCORE', 10, 12, 10, '#8aa0ff');
  txt(String(G.score).padStart(6, '0'), 10, 28, 16, '#ffffff');
  txt('HI', W / 2 - 40, 12, 10, '#ff8a8a', 'center');
  txt(String(G.hi).padStart(6, '0'), W / 2 - 40, 28, 16, '#ffd24d', 'center');
  // buttons
  for (const [b, ic] of [[PAUSE_BTN, 'pause'], [MUTE_BTN, 'mute']]) {
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 2, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    if (ic === 'pause') { ctx.fillRect(b.x - 5, b.y - 6, 3.5, 12); ctx.fillRect(b.x + 1.5, b.y - 6, 3.5, 12); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 6, b.y - 2.5); ctx.lineTo(b.x - 2, b.y - 2.5); ctx.lineTo(b.x + 2, b.y - 6); ctx.lineTo(b.x + 2, b.y + 6); ctx.lineTo(b.x - 2, b.y + 2.5); ctx.lineTo(b.x - 6, b.y + 2.5); ctx.fill();
      if (muted) { ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(b.x - 7, b.y + 7); ctx.lineTo(b.x + 7, b.y - 7); ctx.stroke(); }
      else { ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(b.x + 2, b.y, 5, -0.9, 0.9); ctx.stroke(); }
    }
  }
  // lives
  for (let i = 0; i < Math.min(G.lives - 1, 6); i++) {
    ctx.save(); ctx.translate(18 + i * 24, H - 20); ctx.scale(0.55, 0.55); spr(S.ship, 0, 0); ctx.restore();
  }
  txt('STAGE ' + G.stageNum, 10, H - 40, 10, '#8aa0ff');
  // warp meter
  const ew = 90, ex = W / 2 - ew / 2 - 20, ey = H - 20;
  txt('WARP', ex - 6, ey, 10, '#4df0ff', 'right');
  ctx.fillStyle = 'rgba(77,240,255,0.18)'; ctx.fillRect(ex, ey - 4, ew, 8);
  ctx.fillStyle = P.energy < 20 && !P.warp ? '#ff6b6b' : '#4df0ff';
  ctx.fillRect(ex, ey - 4, ew * P.energy / 100, 8);
  // on-screen warp button
  ctx.globalAlpha = P.warp ? 0.9 : 0.45;
  ctx.fillStyle = P.warp ? 'rgba(77,240,255,0.35)' : 'rgba(77,240,255,0.12)';
  ctx.beginPath(); ctx.arc(WB.x, WB.y, WB.r, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#4df0ff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(WB.x, WB.y, WB.r - 2, -Math.PI / 2, -Math.PI / 2 + TAU * P.energy / 100); ctx.stroke();
  ctx.globalAlpha = 1;
  txt('WARP', WB.x, WB.y, 11, '#d8fbff', 'center');
}

function overlay(lines) {
  ctx.fillStyle = 'rgba(0,0,12,0.55)'; ctx.fillRect(0, 0, W, H);
  lines.forEach(l => txt(l[0], W / 2, l[1], l[2], l[3], 'center', l[4]));
}

function render() {
  const dpr = cv.width / W;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  drawBg();

  if (G.state === 'title') { renderTitle(); return; }

  if (G.kind === 3) drawDock();
  if (G.kind === 4 && boss) drawBoss();
  drawEnemies();

  // player bullets
  ctx.fillStyle = '#fff6a8';
  for (const b of pb) { ctx.fillRect(b.x - 1.5, b.y - 8, 3, 12); }
  ctx.fillStyle = '#ffd24d';
  for (const b of pb) { ctx.fillRect(b.x - 0.5, b.y - 10, 1, 4); }
  // enemy bombs
  for (const b of eb) {
    const p = 0.6 + 0.4 * Math.sin(G.t * 20 + b.x);
    ctx.fillStyle = `rgba(255,120,40,${0.25 * p})`; ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff7a2e'; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff1c2'; ctx.beginPath(); ctx.arc(b.x, b.y, 1.8, 0, TAU); ctx.fill();
  }
  if (P.alive) drawShip(P.x, P.y, P.inv > 0 && G.state === 'play');

  // fx
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
  }
  for (const r of rings) {
    ctx.globalAlpha = clamp(r.life / 0.35, 0, 1) * 0.7; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const p of pops) {
    ctx.globalAlpha = clamp(p.life * 2, 0, 1);
    txt(p.txt, p.x, p.y, p.big ? 15 : 11, p.big ? '#ffd24d' : '#ffffff', 'center');
  }
  ctx.globalAlpha = 1;

  drawHUD();

  if (G.state === 'intro') {
    const a = clamp(Math.min(G.timer, 2.4 - G.timer + 0.3) * 3, 0, 1);
    ctx.globalAlpha = a;
    txt('STAGE ' + G.stageNum, W / 2, 230, 30, '#ffffff', 'center', '#6674ff');
    txt(STAGE_NAMES[G.kind], W / 2, 270, 22, '#ffd24d', 'center');
    wrapHint(STAGE_HINTS[G.kind]);
    if (G.stageNum === 1) {
      txt(G.pad ? 'STICK / D-PAD MOVE · A FIRE · B WARP' : 'DRAG TO MOVE · AUTO-FIRE · HOLD WARP', W / 2, 340, 10, '#9fb0ff', 'center');
    }
    ctx.globalAlpha = 1;
  } else if (G.state === 'clear') {
    txt(G.msg, W / 2, 250, 20, '#6aff7a', 'center', '#2bd44a');
    txt('BONUS +' + G.bonus, W / 2, 285, 16, '#ffd24d', 'center');
  } else if (G.state === 'play' && !P.alive && G.lives <= 0) {
    txt('GAME OVER', W / 2, 300, 24, '#ff5b5b', 'center');
  } else if (G.state === 'paused') {
    overlay([['PAUSED', 280, 30, '#ffffff', '#6674ff'], ['TAP / START / P TO RESUME', 322, 11, '#9fb0ff']]);
  } else if (G.state === 'over') {
    overlay([
      ['GAME OVER', 240, 32, '#ff5b5b', '#ff2d2d'],
      ['SCORE ' + String(G.score).padStart(6, '0'), 292, 18, '#ffffff'],
      [G.score >= G.hi && G.score > 0 ? 'NEW HIGH SCORE!' : 'HI ' + String(G.hi).padStart(6, '0'), 322, 14, '#ffd24d'],
      [G.overT > 0 ? '' : (Math.floor(G.t * 2) % 2 ? '' : 'TAP / A / START TO RETRY'), 380, 14, '#9fb0ff']
    ]);
  }
}
function wrapHint(s) {
  const parts = s.split(' · ');
  parts.forEach((p, i) => txt(p, W / 2, 300 + i * 18, 11, '#9fb0ff', 'center'));
}

function renderTitle() {
  const t = G.t;
  txt('PLEIADES', W / 2, 150 + Math.sin(t * 2) * 3, 46, '#ffffff', 'center', '#6674ff');
  txt('ARCADE SHOOTER', W / 2, 192, 14, '#ffd24d', 'center');
  // attract: bobbing bird row + ship
  for (let i = 0; i < 6; i++) spr(S.bird[0][Math.floor(t * 4 + i) % 2], 60 + i * 48, 250 + Math.sin(t * 2 + i) * 10);
  for (let i = 0; i < 5; i++) spr(S.ufo[0], 84 + i * 48, 296 + Math.sin(t * 2.4 + i) * 8);
  spr(S.ship, W / 2 + Math.sin(t * 1.5) * 90, 400);
  ctx.fillStyle = '#fff6a8'; ctx.fillRect(W / 2 + Math.sin(t * 1.5) * 90 - 1.5, 330 - ((t * 300) % 60), 3, 12);

  const flash = Math.floor(t * 2) % 2;
  if (flash) txt(G.pad ? 'PRESS A / START' : 'TAP TO START', W / 2, 462, 20, '#6aff7a', 'center', '#2bd44a');
  const rows = [
    ['TOUCH', 'DRAG TO MOVE · AUTO-FIRE'],
    ['', 'HOLD [WARP] TO PHASE THROUGH'],
    ['GAMEPAD', 'STICK/D-PAD · A FIRE · B WARP'],
    ['KEYBOARD', 'ARROWS/WASD · SPACE · SHIFT']
  ];
  let y = 520;
  for (const [a, b] of rows) {
    if (a) txt(a, 16, y, 10, '#8aa0ff');
    txt(b, 90, y, 10, '#c9d3ff'); y += 17;
  }
  txt(G.pad ? 'GAMEPAD CONNECTED' : 'PRESS ANY GAMEPAD BUTTON TO CONNECT', W / 2, 600, 10, G.pad ? '#6aff7a' : '#6b77a8', 'center');
  txt('HI ' + String(G.hi).padStart(6, '0'), W / 2, 620, 12, '#ffd24d', 'center');
  // mute button on title
  const b = MUTE_BTN;
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 2, 0, TAU); ctx.stroke();
  txt(muted ? 'OFF' : 'SND', b.x, b.y, 8, '#ffffff', 'center');
}

/* ---------- main loop ---------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.033, Math.max(0, (ts - last) / 1000) || 0);
  last = ts;
  const inp = readInput();
  update(dt, inp);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if (location.search.includes('debug')) window.__pl = { G, P, get en() { return en; }, get boss() { return boss; }, kb, edge, touch, newGame, killPlayer };
})();
</script>
